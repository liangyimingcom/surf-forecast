<style>

  .dirA { --bg:#faf9f5; --card:#fff; --ink:#1c2733; --ink2:#5f6b77; --line:#e8e5dc;

  .dirA.night { --bg:#191713; --card:#221f19; --ink:#ece5d3; --ink2:#a89f8a; --line:#3a352a;
                --sea:#7cc4e0; --sea2:#5aa8c8; --hot:#f0955f; --ok:#7fd0b2; --soft:#2b271f; --soft2:#262218; }
  .dirA .app { background: var(--bg); color: var(--ink); padding: 18px 16px 22px; transition: background .4s, color .4s; }

  .dirA .sub { font-size: 12.5px; color: var(--ink2); margin-bottom: 10px; }

  .dirA .chip.hot { color: var(--hot); }
  .dirA .headline { font-family: Georgia, "Songti SC", serif; font-size: 15px; margin: 8px 0 2px; }
  .dirA .alt { display: flex; justify-content: space-between; font-size: 13px; padding: 8px 2px;

  .dirA .alert { display: flex; gap: 8px; align-items: flex-start; background: #fef3e2; border: 1px solid #f5c98a;

  .dirA .switch.on i { background: var(--ok); }
  .dirA .switch.on i::after { left: 17px; }
  .dirA .axis { font-size: 10px; fill: var(--ink2); }
  /* v4 新增组件 */

  .dirA .facil { display: grid; grid-template-columns: repeat(4,1fr); gap: 6px; margin-top: 8px; }

  .dirA .facil b { display: block; font-size: 15px; }
  .dirA .facil .no { opacity: .4; }
  .dirA .sim .simrow .k { width: 74px; color: var(--ink2); }

  .dirA .eq i { width: 3px; background: var(--ok); border-radius: 2px; animation: eqb 1s infinite ease-in-out; }
  .dirA .eq i:nth-child(2){ animation-delay: .2s; } .dirA .eq i:nth-child(3){ animation-delay: .4s; }
  @keyframes eqb { 0%,100%{height:4px} 50%{height:14px} }
  /* 水质 */
  .dirA .wq { display: flex; align-items: center; gap: 12px; }
  .dirA .wq .dot { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center;
       justify-content: center; font-size: 22px; flex-shrink: 0; }
  .dirA .watch .wt { font-size: 9px; letter-spacing: 1px; color: #8fa0b8; }
  .dirA .watch .ws { font-size: 34px; font-weight: 800; color: #39c6f2; line-height: 1.1; }
  .dirA .watch .ww { font-size: 9.5px; color: #ffb224; margin-top: 4px; }

function compass(day){ const t=T();
  const C=62, R=46, cx=C, cy=C;
  const pt=(deg,r)=>[cx+r*Math.sin(deg*Math.PI/180), cy-r*Math.cos(deg*Math.PI/180)];
  const QLAB={o:'离岸',x:'侧岸',n:'向岸'};
  let s=`<svg viewBox="0 0 ${C*2} ${C*2}" style="width:124px;flex-shrink:0">`;
  s+=`<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="${t.ring}" stroke-width="1.5"/>`;
  const f=157, p0=pt(f-45,R), p1=pt(f+45,R);
  s+=`<path d="M${cx},${cy} L${p0[0]},${p0[1]} A${R},${R} 0 0 1 ${p1[0]},${p1[1]} Z" fill="${t.face}" class="hitseg" data-tip="浪点朝向 157°（SSE）— 接浪扇区"/>`;
  [['N',0],['E',90],['S',180],['W',270]].forEach(([l,d])=>{ const p=pt(d,R+9);
    s+=`<text x="${p[0]}" y="${p[1]+3}" text-anchor="middle" font-size="9.5" fill="${t.axis}">${l}</text>`; });
  [[0,'06时'],[6,'12时'],[12,'18时']].forEach(([i,lab],k)=>{
    const q=day.q[i], c=q==='o'?t.qo:q==='x'?t.qx:t.qn;
    const go=(day.wdirs[k]+180)%360, pa=pt(go,R-8), pb=pt(go,10);
    s+=`<line x1="${pb[0]}" y1="${pb[1]}" x2="${pa[0]}" y2="${pa[1]}" stroke="${c}" stroke-width="${3-k*0.5}"
        class="hitseg" data-tip="${lab} ${QLAB[q]}风 ${day.wind[i]}kn（去向 ${go}°）"/>`;
    const tip=pt(go,R-4);
    s+=`<circle cx="${tip[0]}" cy="${tip[1]}" r="3.5" fill="${c}" class="hitseg" data-tip="${lab} ${QLAB[q]}风"/>`; });
  s+=`<circle cx="${cx}" cy="${cy}" r="3" fill="${t.axis}"/>`;
  return s+'</svg>';
}

    <button class="whybtn" onclick="why()">🤔 为什么是 ${d.score} 分？看图解分析 →</button>
  </div>
  <div class="card">
    <div class="sect" style="margin-top:0">🚗 几点出门（按你的通勤自动倒推）</div>
    <div class="depart">
      <span class="t">${departTime(d)}</span><span style="color:var(--ink2)">出门 →</span>
      <span>${d.winStart} 下水</span>
    </div>
    <div class="depart" style="font-size:11.5px;color:var(--ink2)">
      车程 <button onclick="commute(-5)">−</button> <b style="color:var(--ink)">${state.commute}min</b>
      <button onclick="commute(5)">＋</button> ＋ 收拾装备 15min
      <button style="width:auto;padding:0 10px;border-radius:999px;font-size:11px" onclick="toast('📅 已生成 .ics：${d.week} ${d.winStart} 黄金海岸冲浪（含出门提醒）')">📅 加入日历</button>
    </div>
  </div>
  <div class="sect">带什么</div>${gearRow(d)}
  <div class="card">
    <div class="sect" style="margin-top:0">🆘 入水报备</div>
    <div class="checkin">
      <button class="big ${state.checkin?'armed':''}" onclick="checkin()">
        ${state.checkin?`🏄 冲浪中 · ${state.checkinAt} 入水 — 上岸点我销记`:'🌊 我下水了（默认 2h 后核实）'}</button>
    </div>
    <div class="caption">${state.checkin
      ?'超 2h 未销记 → 自动短信提醒你的紧急联系人（含浪点定位）。'
      :'一个人冲浪最怕没人知道你在水里。下水点一下，上岸销一下。'}</div>
  </div>
  <div class="sect">🅿️ 浪点设施（NEW · 悬停看备注）</div>
  <div class="facil">
    <div class="hitseg" data-tip="沙滩北口免费停车场 ~60 位，周末 08:00 后难找位"><b>🅿️</b>停车 免费</div>
    <div class="hitseg" data-tip="更衣间旁淡水冲洗 · 5元不限时"><b>🚿</b>淡水冲洗</div>
    <div class="hitseg" data-tip="浪人小屋租板：短板80/长板100 半天"><b>🏄</b>租板 ¥80+</div>
    <div class="hitseg no" data-tip="最近的咖啡在 2km 外镇上——自带热水吧"><b>☕</b>咖啡 无</div>
  </div>
  <div class="coach"><span class="ai">🤖</span><span><b>AI 教练</b> · ${d.coachN}</span></div>
  <div class="plan"><b>🏄 行动建议</b><br>${d.window}到场，${d.board}。</div>`; }

function vExpert(){ const d=DAYS[state.sel];
  return `<div class="brand"><span>黄金海岸 · ${d.week} ${d.date} · 置信度${d.conf[1]} ${d.conf[0]}</span>
    <button class="unitbtn" onclick="setUnit()">${state.unit==='m'?'m ⇄ ft':'ft ⇄ m'}</button></div>${strip()}
  <div class="card"><div class="sect" style="margin-top:0">🕛 全天冲浪时间轴</div>
    ${timeline24(d,state.sel===0)}</div>
  <div class="card">
    <span class="score">${d.score}<small>/10</small></span>
    <div style="margin:6px 0">${Object.entries(d.dims).map(([k,v])=>`<span class="chip">${k} <b style="color:${v>=10?'var(--ok)':'var(--ink)'}">${v}</b></span>`).join('')}</div>
    ${waveChart(d)}
    <div class="caption">蓝柱 浪高 · 虚线 谱峰周期 Tp（悬停柱子）</div>
  </div>

  <div class="card">${dnaBlock()}</div>
  <div class="card">
    <div class="sect" style="margin-top:0">🌀 这股浪从哪来 · 涌浪溯源</div>
    ${stormMap()}
    <div class="caption" style="line-height:1.7">${STORM.story}</div>
  </div>
  <div class="card" style="display:flex;gap:10px;align-items:center">
    ${compass(d)}
    <div style="font-size:12px;color:var(--ink2);line-height:1.7"><b style="color:var(--ink)">🧭 风向罗盘</b><br>
    扇区=接浪朝向(157°)。三支箭=06/12/18时风矢量。晨风入扇区=离岸=好。</div></div>
  <div class="card"><div class="sect" style="margin-top:0">📊 浪点季节志 · 黄金海岸哪月最好</div>
    ${seasonGrid()}
    <div class="caption">9-10 月台风涌季 = 长周期大浪；本月（7 月）属中上。悬停月份看注解。</div></div>
  <div class="lesson"><b>📖 ${d.lesson[0]}</b><br>${d.lesson[1]}</div>
  <div class="coach"><span class="ai">🤖</span><span><b>AI 教练</b> · ${d.coachE}</span></div>
  <details class="review"><summary>🔁 昨日回看（周一 07-27）· 校验预报准度 — 展开 ▾</summary>
    <p style="margin:8px 0 2px">系统当时预报：1.0m · 6.6s · 3kn · 综合 8.05/10</p>
    <p style="margin:6px 0 2px;font-weight:600">昨天报得准吗？</p>
    <div class="vbtns">${['准','偏乐观','偏保守','没下水'].map(k=>
      `<button class="${state.voted===k?'on':''}" onclick="vote('${k}')">${k}</button>`).join('')}</div>
    ${state.voted?`<p style="margin-top:8px;font-size:12px">✅ 已记录「${state.voted}」——多次自评会校准本浪点的系统性偏差（当前 -0.3）。</p>`:''}
  </details>`; }

  

/* ================= 交互 ================= */
function renderAll(){
  document.getElementById('A-home').innerHTML=vHome();
  document.getElementById('A-novice').innerHTML=vNovice();
  document.getElementById('A-expert').innerHTML=vExpert();
}
function pick(i){ state.sel=i; renderAll(); }
/* v4 handlers */
function crowdVote(k){
  if(state.crowdVote===k){ state.crowdN[k]--; state.crowdVote=''; }
  else { if(state.crowdVote) state.crowdN[state.crowdVote]--;
         state.crowdN[k]++; state.crowdVote=k; }
  renderAll(); toast(state.crowdVote?`🌊 已投「浪${k}」，谢谢实测`:'已撤票');
}
function checkin(){
  state.checkin=!state.checkin;
  if(state.checkin){ const n=new Date();
    state.checkinAt=`${String(n.getHours()).padStart(2,'0')}:${String(n.getMinutes()).padStart(2,'0')}`;
    toast('🆘 已报备下水 · 2h 后未销记将提醒紧急联系人'); }
  else toast('✅ 已销记，冲得开心');
  renderAll();
}
function setUnit(){ state.unit=state.unit==='m'?'ft':'m'; renderAll(); toast(`单位已切到 ${state.unit}`); }
function commute(d){ state.commute=Math.max(5,Math.min(180,state.commute+d)); renderAll(); }
function vote(k){ state.voted=k; renderAll();
  document.querySelectorAll('#A-expert details.review').forEach(x=>x.open=true); }
function why(){ const f=document.getElementById('A-expert-frame');
  f.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  f.classList.add('flash'); setTimeout(()=>f.classList.remove('flash'),1400); }
function toggleNight(){ state.night=!state.night;
  document.getElementById('dirA-root').classList.toggle('night',state.night);
  document.getElementById('nightbtn').classList.toggle('on',state.night);
  document.getElementById('nightbtn').textContent = state.night?'☀️ 回到日间':'🌙 夜读模式';
  renderAll(); }
function toast(msg){ const t=document.getElementById('tt');
  t.textContent=msg; t.style.display='block';
  t.style.left='50%'; t.style.top='24px'; t.style.transform='translateX(-50%)';
  clearTimeout(t._h); t._h=setTimeout(()=>{t.style.display='none';t.style.transform='';t._h=null;},1500); }
const QRPAT='11010101110110011010101011010101011010111011010110'.split('');
function share(){ const d=DAYS[state.sel];
  document.getElementById('shareinner').innerHTML=`<div class="scard">
    <div class="sc-brand">浪报 SURF DAILY</div>
    <div class="sc-spot">黄金海岸</div>
    <div class="sc-score">${d.score}<small>/10 ${d.tag}</small></div>
    <div class="sc-line">${d.week} ${d.date} · ${d.window}<br>「${d.novice}」</div>
    <div class="sc-foot"><span>surf-daily.example<br>先验证过去，再相信未来</span>
      <span class="qr">${QRPAT.map(b=>`<i class="${b==='0'?'o':''}"></i>`).join('')}</span></div>
    <div class="sc-actions">
      <button style="background:#1a1a19;color:#fff" onclick="toast('✅ 已复制分享文案+链接')">复制文案</button>
      <button style="background:#e5e2da" onclick="document.getElementById('sharemask').classList.remove('open')">关闭</button>
    </div></div>`;
  document.getElementById('sharemask').classList.add('open'); }

document.addEventListener('mousemove',e=>{
  const el=e.target.closest('.hitbar,.hitseg'); const t=document.getElementById('tt');
  if(el&&el.dataset.tip){ t.textContent=el.dataset.tip; t.style.display='block'; t.style.transform='';
    t.style.left=Math.min(e.clientX+14,window.innerWidth-260)+'px'; t.style.top=(e.clientY+14)+'px'; }
  else if(!t._h){ t.style.display='none'; }
});

renderAll();
</script>
</body>
</html>
